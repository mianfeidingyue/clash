<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Source Han Sans SC,sans-serif"><rect width="1200" height="640" rx="16" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs><text x="40" y="52" font-size="26" font-weight="800" fill="#1f2328">节点全部超时：按这个顺序排查</text>
<rect x="60" y="85" width="640" height="62" rx="12" fill="#e0f2f7" stroke="#0e7490" stroke-width="2"/><text x="85" y="123" font-size="20" font-weight="700" fill="#1f2328">① 本地网络能打开国内网站吗？</text><line x1="380" y1="147" x2="380" y2="171" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="700" y1="116" x2="780" y2="116" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah)"/><text x="795" y="122" font-size="17" fill="#b91c1c">否 → 先修好本地网络</text><rect x="60" y="173" width="640" height="62" rx="12" fill="#e0f2f7" stroke="#0e7490" stroke-width="2"/><text x="85" y="211" font-size="20" font-weight="700" fill="#1f2328">② 系统时间是否准确（误差 < 1 分钟）？</text><line x1="380" y1="235" x2="380" y2="259" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="700" y1="204" x2="780" y2="204" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah)"/><text x="795" y="210" font-size="17" fill="#b91c1c">否 → 开启自动同步时间</text><rect x="60" y="261" width="640" height="62" rx="12" fill="#e0f2f7" stroke="#0e7490" stroke-width="2"/><text x="85" y="299" font-size="20" font-weight="700" fill="#1f2328">③ 订阅是否过期 / 流量用完？</text><line x1="380" y1="323" x2="380" y2="347" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="700" y1="292" x2="780" y2="292" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah)"/><text x="795" y="298" font-size="17" fill="#b91c1c">是 → 续费或换订阅</text><rect x="60" y="349" width="640" height="62" rx="12" fill="#e0f2f7" stroke="#0e7490" stroke-width="2"/><text x="85" y="387" font-size="20" font-weight="700" fill="#1f2328">④ 客户端和内核是否最新版？</text><line x1="380" y1="411" x2="380" y2="435" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="700" y1="380" x2="780" y2="380" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah)"/><text x="795" y="386" font-size="17" fill="#b91c1c">否 → 更新到最新版</text><rect x="60" y="437" width="640" height="62" rx="12" fill="#e0f2f7" stroke="#0e7490" stroke-width="2"/><text x="85" y="475" font-size="20" font-weight="700" fill="#1f2328">⑤ 关闭 TUN / 其他代理 / 杀毒后再试</text><line x1="380" y1="499" x2="380" y2="523" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="700" y1="468" x2="780" y2="468" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah)"/><text x="795" y="474" font-size="17" fill="#b91c1c">好了 → 是软件冲突</text><rect x="60" y="525" width="640" height="62" rx="12" fill="#e0f2f7" stroke="#0e7490" stroke-width="2"/><text x="85" y="563" font-size="20" font-weight="700" fill="#1f2328">⑥ 查看机场公告：是否维护或被墙</text>
<line x1="700" y1="556" x2="780" y2="556" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ah)"/><text x="795" y="562" font-size="17" fill="#b91c1c">是 → 等恢复或换机场</text></svg>