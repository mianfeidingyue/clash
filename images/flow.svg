<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Source Han Sans SC,sans-serif"><rect width="1200" height="420" rx="16" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs><text x="40" y="50" font-size="26" font-weight="800" fill="#1f2328">一张图看懂：机场 → 订阅 → 客户端 → 分流</text>
<rect x="40" y="150" width="200" height="110" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text x="140" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">机场 / 服务商</text><text x="140" y="225" text-anchor="middle" font-size="14" fill="#59636e">提供节点服务器</text>
<rect x="320" y="150" width="200" height="110" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="420" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">订阅链接</text><text x="420" y="225" text-anchor="middle" font-size="14" fill="#59636e">一串 URL，打包全部节点</text>
<rect x="600" y="150" width="220" height="110" rx="12" fill="#e0f2f7" stroke="#0e7490" stroke-width="2"/><text x="710" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">客户端</text><text x="710" y="225" text-anchor="middle" font-size="14" fill="#59636e">Clash / v2rayN / 小火箭</text>
<rect x="900" y="90" width="260" height="90" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="1030" y="129" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">海外网站 → 走代理</text><text x="1030" y="155" text-anchor="middle" font-size="14" fill="#59636e">Google / YouTube / ChatGPT</text>
<rect x="900" y="230" width="260" height="90" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="2"/><text x="1030" y="269" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">国内网站 → 直连</text><text x="1030" y="295" text-anchor="middle" font-size="14" fill="#59636e">淘宝 / B站 / 微信</text>
<line x1="240" y1="205" x2="318" y2="205" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/><text x="279" y="197" text-anchor="middle" font-size="13" fill="#59636e">生成</text><line x1="520" y1="205" x2="598" y2="205" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/><text x="559" y="197" text-anchor="middle" font-size="13" fill="#59636e">导入</text>
<line x1="820" y1="190" x2="898" y2="140" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/><text x="859" y="157" text-anchor="middle" font-size="13" fill="#59636e">规则</text><line x1="820" y1="220" x2="898" y2="270" stroke="#59636e" stroke-width="2.5" marker-end="url(#ah)"/><text x="859" y="237" text-anchor="middle" font-size="13" fill="#59636e">规则</text>
<text x="40" y="330" font-size="16" fill="#59636e">要点：订阅链接 = 账号凭证，不要公开分享；客户端负责“哪些流量走代理、哪些直连”。</text>
<text x="40" y="360" font-size="16" fill="#59636e">免费订阅也是同样流程，区别在于节点由谁提供、能稳定多久。</text></svg>