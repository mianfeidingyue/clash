<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,Source Han Sans SC,sans-serif"><rect width="1200" height="520" rx="16" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="800" fill="#1f2328">免费订阅 vs 付费机场</text>
<g font-size="18"><rect x="40" y="80" width="300" height="50" rx="8" fill="#1f2328"/><text x="190" y="112" text-anchor="middle" fill="#fff" font-weight="700">对比项</text>
<rect x="350" y="80" width="400" height="50" rx="8" fill="#b91c1c"/><text x="550" y="112" text-anchor="middle" fill="#fff" font-weight="700">免费订阅</text>
<rect x="760" y="80" width="400" height="50" rx="8" fill="#15803d"/><text x="960" y="112" text-anchor="middle" fill="#fff" font-weight="700">付费机场</text>
<rect x="40" y="140" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="190" y="171" text-anchor="middle" fill="#1f2328" font-weight="700">稳定性</text>
<rect x="350" y="140" width="400" height="50" rx="8" fill="#fee2e2"/><text x="550" y="171" text-anchor="middle" fill="#1f2328">✗ 低：常失效</text>
<rect x="760" y="140" width="400" height="50" rx="8" fill="#dcfce7"/><text x="960" y="171" text-anchor="middle" fill="#1f2328">✓ 高</text><rect x="40" y="198" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="190" y="229" text-anchor="middle" fill="#1f2328" font-weight="700">晚高峰速度</text>
<rect x="350" y="198" width="400" height="50" rx="8" fill="#fee2e2"/><text x="550" y="229" text-anchor="middle" fill="#1f2328">✗ 常严重变慢</text>
<rect x="760" y="198" width="400" height="50" rx="8" fill="#dcfce7"/><text x="960" y="229" text-anchor="middle" fill="#1f2328">✓ 专线较稳</text><rect x="40" y="256" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="190" y="287" text-anchor="middle" fill="#1f2328" font-weight="700">流媒体 / ChatGPT</text>
<rect x="350" y="256" width="400" height="50" rx="8" fill="#fee2e2"/><text x="550" y="287" text-anchor="middle" fill="#1f2328">✗ 多数不可用</text>
<rect x="760" y="256" width="400" height="50" rx="8" fill="#dcfce7"/><text x="960" y="287" text-anchor="middle" fill="#1f2328">✓ 多数可用</text><rect x="40" y="314" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="190" y="345" text-anchor="middle" fill="#1f2328" font-weight="700">隐私</text>
<rect x="350" y="314" width="400" height="50" rx="8" fill="#fee2e2"/><text x="550" y="345" text-anchor="middle" fill="#1f2328">✗ 来源不明，风险高</text>
<rect x="760" y="314" width="400" height="50" rx="8" fill="#dcfce7"/><text x="960" y="345" text-anchor="middle" fill="#1f2328">✓ 有运营方可追责</text><rect x="40" y="372" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="190" y="403" text-anchor="middle" fill="#1f2328" font-weight="700">售后</text>
<rect x="350" y="372" width="400" height="50" rx="8" fill="#fee2e2"/><text x="550" y="403" text-anchor="middle" fill="#1f2328">✗ 没有</text>
<rect x="760" y="372" width="400" height="50" rx="8" fill="#dcfce7"/><text x="960" y="403" text-anchor="middle" fill="#1f2328">✓ 工单 / 频道</text><rect x="40" y="430" width="300" height="50" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/><text x="190" y="461" text-anchor="middle" fill="#1f2328" font-weight="700">成本</text>
<rect x="350" y="430" width="400" height="50" rx="8" fill="#fee2e2"/><text x="550" y="461" text-anchor="middle" fill="#1f2328">✗ 0 元，但耗时间</text>
<rect x="760" y="430" width="400" height="50" rx="8" fill="#dcfce7"/><text x="960" y="461" text-anchor="middle" fill="#1f2328">✓ 月付几元到几十元</text></g>
<text x="40" y="505" font-size="15" fill="#59636e">建议：免费订阅只用来临时体验；日常办公、AI 工具、流媒体用付费机场，先买月付试用。</text></svg>